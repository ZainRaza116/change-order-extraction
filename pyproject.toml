[project]
name = "co-extract"
version = "0.1.0"
description = "Extract structured, validated JSON with per-field confidence from messy construction change orders."
readme = "README.md"
authors = [{ name = "Syed Zain Raza" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24,<2", # 2.x bundles an onnxruntime layout model we don't use
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "openai>=1.50",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
co-extract = "co_extract.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "httpx>=0.27",     # FastAPI TestClient
    "pillow>=10.0",    # scripts/make_samples.py and OCR tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co_extract"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["co_extract", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type (Swig|swig).* has no __module__:DeprecationWarning"]
